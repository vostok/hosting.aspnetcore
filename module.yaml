base:
  build:
    target: none
    configuration: none

  install:
    - module vostok.hosting.abstractions
    - module vostok.hosting
    - module vostok.throttling
    - module vostok.throttling.metrics

  deps:
    - vostok.configuration.sources
    - vostok.logging.context
    - vostok.configuration.microsoft
    - vostok.metrics
    - vostok.configuration
    - vostok.configuration.abstractions
    - vostok.devtools
    - vostok.hosting
    - vostok.hosting.abstractions
    - vostok.logging.microsoft
    - vostok.logging.abstractions
    - vostok.servicediscovery.abstractions
    - vostok.servicediscovery

notests > base:
  build:
    target: Vostok.Hosting.AspNetCore.sln
    configuration: NoTests
    parameters: build -property:TargetFrameworks=net6.0
    tool:
      name: dotnet

  install:
    - Vostok.Hosting.AspNetCore/bin/Release/net6.0/Vostok.Hosting.AspNetCore.dll
    - module vostok.applications.aspnetcore/v6_0@bump-opentelemetry

  deps:
    - vostok.applications.aspnetcore/v6_0@bump-opentelemetry

mtf > base:
  build:
    target: Vostok.Hosting.AspNetCore.sln
    configuration: NoTests
    tool:
      name: dotnet

  install:
    - groups:
        - target-framework: "net6.0"
          libraries:
            - Vostok.Hosting.AspNetCore/bin/Release/net6.0/Vostok.Hosting.AspNetCore.dll
          modules:
            - name: vostok.applications.aspnetcore@bump-opentelemetry
        - target-framework: "net8.0"
          libraries:
            - Vostok.Hosting.AspNetCore/bin/Release/net8.0/Vostok.Hosting.AspNetCore.dll
          modules:
            - name: vostok.applications.aspnetcore@bump-opentelemetry

  deps:
    - vostok.applications.aspnetcore@bump-opentelemetry

v6_0 > base *default:
  build:
    target: Vostok.Hosting.AspNetCore.sln
    configuration: NoTests
    parameters: build -property:TargetFrameworks=net6.0
    tool:
      name: dotnet

  install:
    - Vostok.Hosting.AspNetCore/bin/Release/net6.0/Vostok.Hosting.AspNetCore.dll
    - module vostok.applications.aspnetcore/v6_0@bump-opentelemetry

  deps:
    - vostok.applications.aspnetcore/v6_0@bump-opentelemetry

v8_0 > base:
  build:
    target: Vostok.Hosting.AspNetCore.sln
    configuration: NoTests
    parameters: build -property:TargetFrameworks=net8.0
    tool:
      name: dotnet

  install:
    - Vostok.Hosting.AspNetCore/bin/Release/net8.0/Vostok.Hosting.AspNetCore.dll
    - module vostok.applications.aspnetcore/v8_0@bump-opentelemetry

  deps:
    - vostok.applications.aspnetcore/v8_0@bump-opentelemetry

full-build > base:
  deps:
    - vostok.applications.aspnetcore/full-build@bump-opentelemetry
    - vostok.logging.formatting

  build:
    target: Vostok.Hosting.AspNetCore.sln
    configuration: Release
    tool:
      name: dotnet
